<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Estoque e Preços</title>
    
    <!-- Configurações para funcionar como Aplicativo no Celular -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .alert-low-stock { background-color: #fef2f2 !important; border-color: #fca5a5 !important; }
        .alert-low-stock span { color: #991b1b !important; }
        .alert-low-stock input { color: #991b1b !important; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800 pb-24">

    <div class="max-w-4xl mx-auto">
        <!-- Cabeçalho Principal -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-xl md:text-2xl font-bold text-slate-700 flex items-center">
                <i class="fas fa-box-open text-blue-600 mr-3 text-2xl"></i> 
                Gestor de Estoque
            </h1>
            <button onclick="adicionarLinha()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-xl shadow-sm transition font-medium text-sm flex justify-center items-center active:scale-95">
                <i class="fas fa-plus mr-2"></i> Novo Produto
            </button>
        </div>

        <!-- Container da Lista de Produtos (Cards) -->
        <div id="listaProdutos" class="flex flex-col gap-5">
            <!-- Os cards serão inseridos aqui via JavaScript -->
        </div>
    </div>

    <script>
        const formatarMoeda = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor || 0);
        const formatarPorcentagem = (valor) => new Intl.NumberFormat('pt-BR', { style: 'percent', minimumFractionDigits: 1 }).format((valor || 0) / 100);

        let contadorId = 0;

        // BANCO DE DADOS LOCAL: Salva todos os dados no aparelho
        function salvarBancoDados() {
            const itens = [];
            document.querySelectorAll('[id^="linha-"]').forEach(linha => {
                itens.push({
                    id: linha.id.replace('linha-', ''),
                    nome: linha.querySelector('.input-nome').value,
                    estoque: linha.querySelector('.input-estoque').value,
                    custo: linha.querySelector('.input-custo').value,
                    margem: linha.querySelector('.input-margem').value,
                    desconto: linha.querySelector('.input-desconto').value
                });
            });
            localStorage.setItem('estoque_db', JSON.stringify(itens));
        }

        // Função principal de cálculo e formatação
        function calcularValores(id, salvar = true) {
            const linha = document.getElementById(`linha-${id}`);
            if(!linha) return;

            const custoInput = linha.querySelector('.input-custo');
            const margemInput = linha.querySelector('.input-margem');
            const descontoInput = linha.querySelector('.input-desconto');
            const estoqueInput = linha.querySelector('.input-estoque');
            
            const estoque = parseInt(estoqueInput.value) || 0;
            const custo = parseFloat(custoInput.value) || 0;
            const margem = parseFloat(margemInput.value) || 0;
            const desconto = parseFloat(descontoInput.value) || 0;

            const cellVitrine = linha.querySelector('.res-vitrine');
            const cellFinal = linha.querySelector('.res-final');
            const cellLucroRs = linha.querySelector('.res-lucro-rs');
            const cellLucroPct = linha.querySelector('.res-lucro-pct');
            const containerEstoque = linha.querySelector('.container-estoque');

            // Alerta visual de estoque (<= 3)
            if (estoque <= 3) {
                containerEstoque.classList.add('alert-low-stock');
            } else {
                containerEstoque.classList.remove('alert-low-stock');
            }

            if (custo > 0) {
                const precoVitrine = (custo * (1 + (margem / 100))) / (1 - (desconto / 100));
                const precoFinal = precoVitrine * (1 - (desconto / 100));
                const lucroRs = precoFinal - custo;
                const lucroPct = (lucroRs / custo) * 100;

                cellVitrine.textContent = formatarMoeda(precoVitrine);
                cellFinal.textContent = formatarMoeda(precoFinal);
                cellLucroRs.textContent = formatarMoeda(lucroRs);
                cellLucroPct.textContent = formatarPorcentagem(lucroPct);
                cellLucroRs.className = `res-lucro-rs font-bold text-lg ${lucroRs < 0 ? 'text-red-600' : 'text-slate-700'}`;
            } else {
                cellVitrine.textContent = '-';
                cellFinal.textContent = '-';
                cellLucroRs.textContent = '-';
                cellLucroPct.textContent = '-';
            }

            // Atualiza o banco de dados sempre que houver recálculo
            if(salvar) salvarBancoDados();
        }

        // Funções dos botões de quantidade
        function alterarEstoque(id, delta) {
            const input = document.querySelector(`#linha-${id} .input-estoque`);
            let novoValor = (parseInt(input.value) || 0) + delta;
            if (novoValor < 0) novoValor = 0;
            input.value = novoValor;
            calcularValores(id);
        }

        // Adicionar a estrutura do Produto (Card)
        function criarLinhaHTML() {
            contadorId++;
            const id = contadorId;
            const div = document.createElement('div');
            div.id = `linha-${id}`;
            div.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-5 transition-all w-full";
            
            div.innerHTML = `
                <div class="flex justify-between items-start mb-5 gap-3 border-b border-slate-100 pb-4">
                    <div class="w-full">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Nome do Produto</span>
                        <input type="text" placeholder="Ex: Vestido Floral" class="input-nome w-full bg-transparent border-none focus:ring-0 text-slate-800 font-bold text-lg md:text-xl placeholder-slate-300 p-0" oninput="salvarBancoDados()">
                    </div>
                    <button onclick="removerLinha(${id})" class="bg-red-50 text-red-500 hover:bg-red-500 hover:text-white transition-colors p-3 rounded-xl flex-shrink-0 active:scale-95" title="Apagar Produto">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
                    <div class="col-span-2 md:col-span-1 bg-slate-50 p-3 rounded-xl border border-slate-200 container-estoque transition-colors flex flex-col justify-center items-center">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Estoque</span>
                        <div class="flex items-center justify-center space-x-3 w-full">
                            <button onclick="alterarEstoque(${id}, -1)" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-slate-300 text-slate-600 hover:bg-slate-200 shadow-sm active:scale-95 transition-transform"><i class="fas fa-minus"></i></button>
                            <input type="number" class="input-estoque w-14 text-center bg-transparent border-none focus:ring-0 font-black text-2xl text-slate-700 p-0" value="0" min="0" oninput="calcularValores(${id})">
                            <button onclick="alterarEstoque(${id}, 1)" class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-600 text-white hover:bg-blue-700 shadow-sm active:scale-95 transition-transform"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="p-3 bg-white border border-slate-200 rounded-xl flex flex-col justify-center">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 block">Custo</span>
                        <div class="flex items-center text-slate-700 font-bold text-lg">
                            <span class="mr-1 text-slate-400">R$</span>
                            <input type="number" step="0.01" class="input-custo w-full bg-transparent border-none focus:ring-0 p-0 text-slate-700" placeholder="0.00" oninput="calcularValores(${id})">
                        </div>
                    </div>
                    
                    <div class="p-3 bg-white border border-slate-200 rounded-xl flex flex-col justify-center">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 block">Margem</span>
                        <div class="flex items-center text-slate-700 font-bold text-lg">
                            <input type="number" class="input-margem w-full bg-transparent border-none focus:ring-0 p-0 text-slate-700" placeholder="0" oninput="calcularValores(${id})">
                            <span class="ml-1 text-slate-400">%</span>
                        </div>
                    </div>
                    
                    <div class="p-3 bg-white border border-slate-200 rounded-xl flex flex-col justify-center">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1 block">Desconto</span>
                        <div class="flex items-center text-slate-700 font-bold text-lg">
                            <input type="number" class="input-desconto w-full bg-transparent border-none focus:ring-0 p-0 text-slate-700" placeholder="0" oninput="calcularValores(${id})">
                            <span class="ml-1 text-slate-400">%</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="col-span-1 p-3 rounded-lg bg-orange-50 border border-orange-100 flex flex-col">
                        <span class="text-xs font-bold text-orange-800 uppercase tracking-wider mb-1">Preço Vitrine</span>
                        <span class="res-vitrine text-orange-900 font-black text-xl">-</span>
                    </div>
                    
                    <div class="col-span-1 p-3 rounded-lg bg-teal-50 border border-teal-100 flex flex-col">
                        <span class="text-xs font-bold text-teal-800 uppercase tracking-wider mb-1">Preço c/ Desconto</span>
                        <span class="res-final text-teal-900 font-black text-xl">-</span>
                    </div>
                    
                    <div class="col-span-1 p-3 rounded-lg bg-white border border-slate-200 flex flex-col">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Lucro (R$)</span>
                        <span class="res-lucro-rs text-slate-700 font-bold text-lg">-</span>
                    </div>
                    
                    <div class="col-span-1 p-3 rounded-lg bg-white border border-slate-200 flex flex-col">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Margem Real</span>
                        <span class="res-lucro-pct text-slate-500 font-bold text-lg">-</span>
                    </div>
                </div>
            `;
            return { id, div };
        }

        function adicionarLinha() {
            const container = document.getElementById('listaProdutos');
            const { id, div } = criarLinhaHTML();
            container.insertBefore(div, container.firstChild);
            calcularValores(id, true);
        }

        function removerLinha(id) {
            const linha = document.getElementById(`linha-${id}`);
            if(linha) {
                linha.remove();
                salvarBancoDados();
            }
        }

        // CARREGA O BANCO DE DADOS AO ABRIR O APLICATIVO
        window.onload = () => {
            const container = document.getElementById('listaProdutos');
            const dadosSalvos = localStorage.getItem('estoque_db');
            
            if (dadosSalvos && dadosSalvos !== '[]') {
                const itens = JSON.parse(dadosSalvos);
                // Renderiza na ordem correta
                itens.reverse().forEach(item => {
                    const { id, div } = criarLinhaHTML();
                    container.insertBefore(div, container.firstChild);
                    
                    const linha = document.getElementById(`linha-${id}`);
                    linha.querySelector('.input-nome').value = item.nome;
                    linha.querySelector('.input-estoque').value = item.estoque;
                    linha.querySelector('.input-custo').value = item.custo;
                    linha.querySelector('.input-margem').value = item.margem;
                    linha.querySelector('.input-desconto').value = item.desconto;
                    
                    calcularValores(id, false); // false = não precisa salvar ao carregar
                });
            } else {
                // Se não houver dados, cria um de exemplo
                adicionarLinha();
                const linha = document.getElementById('linha-1');
                linha.querySelector('.input-nome').value = "Vestido Floral";
                linha.querySelector('.input-custo').value = 100;
                linha.querySelector('.input-margem').value = 30;
                linha.querySelector('.input-desconto').value = 10;
                linha.querySelector('.input-estoque').value = 4;
                calcularValores(1, true);
            }
        };
    </script>
</body>
</html>
